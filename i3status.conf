general {
    output_format = "i3bar"
    colors = true
    interval = 1
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "memory"
order += "cpu_usage"
order += "volume master"
order += "tztime date"
order += "tztime time"

battery all {
    format = " %status %percentage %remaining "
    format_down = " No battery "
    status_chr = " ⚡"
    status_bat = " 🔋"
    status_unk = " ?"
    status_full = " ☻"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 10
}

cpu_usage {
    format = " 💻 %usage "
}

volume master {
    format = " ♪ %volume "
    format_muted = " ♪ muted (%volume) "
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

tztime date {
    format = " 📅 %d/%m/%Y "
}

tztime time {
    format = " 🕒 %H:%M:%S "
}
