# ┌──────────────────────────────────────────────────────────────────┐
# │  Wallpaper                                                       │
# └──────────────────────────────────────────────────────────────────┘
exec --no-startup-id "feh --bg-fill ~/.config/i3/wallpapers/abstract_dark.jpg"
bindsym Mod4+w exec --no-startup-id "feh --randomize --bg-fill ~/.config/i3/wallpapers/*"
