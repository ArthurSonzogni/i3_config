# Theme Color Palette (Sleek Dark Mode / Blue)
set $bg-focused       #096BAA
set $border-focused   #3F8AC2
set $text-focused     #FFFFFF
set $indicator        #00DA8E

hide_edge_borders both
default_border none
default_floating_border none

client.focused          $border-focused $bg-focused $text-focused $indicator $border-focused
client.focused_inactive #333333 #5F676A #ffffff #484e50
client.unfocused        #333333 #424242 #888888 #292d2e
client.urgent           #C10004 #900000 #ffffff #900000

font pango: Ubuntu Mono 12

# ┌──────────────────────────────────────────────────────────────────┐
# │  Gaps                                                            │
# └──────────────────────────────────────────────────────────────────┘
gaps inner 10
gaps horizontal 5
gaps vertical 5
smart_gaps on

