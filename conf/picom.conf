# ┌──────────────────────────────────────────────────────────────────┐
# │  Animations                                                      │
# └──────────────────────────────────────────────────────────────────┘
animations = (
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start = 0.6;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close"];
    opacity = {
      curve = "linear";
      duration = 0.2;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    make-transparent = true;
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.2;
      start = 1;
      end = 0.6;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-y-before - window-y";
      end = 0;
    };
  }
);

# ┌──────────────────────────────────────────────────────────────────┐
# │  Shadows                                                         │
# └──────────────────────────────────────────────────────────────────┘
shadow = false;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.75;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:s"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Fading                                                          │
# └──────────────────────────────────────────────────────────────────┘
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
fade-exclude = [ ];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Opacity & Dimming                                               │
# └──────────────────────────────────────────────────────────────────┘
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.15;

opacity-rule = [
    "90:class_g = 'Gnome-terminal'",
    "95:class_g = 'Code'",
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'firefox'"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Blur                                                            │
# └──────────────────────────────────────────────────────────────────┘
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:s"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Corners                                                         │
# └──────────────────────────────────────────────────────────────────┘
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  General Settings                                                │
# └──────────────────────────────────────────────────────────────────┘
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

rules = (
  {
    match = "window_type = 'normal' && (fullscreen || (_NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@:a *= '_NET_WM_STATE_MAXIMIZED_HORZ'))";
    corner-radius = 0;
  },
  {
    match = "window_type = 'dock' || class_g = 'Polybar'";
    corner-radius = 0;
  }
);

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};
