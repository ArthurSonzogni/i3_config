# ┌──────────────────────────────────────────────────────────────────┐
# │  Animations                                                      │
# └──────────────────────────────────────────────────────────────────┘
animations = (
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start = 0.6;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close"];
    opacity = {
      curve = "linear";
      duration = 0.2;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.2;
      start = 1;
      end = 0.6;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0,0,0,1)";
      duration = 0.4;
      start = "window-y-before - window-y";
      end = 0;
    };
  }
);

# ┌──────────────────────────────────────────────────────────────────┐
# │  Fading                                                          │
# └──────────────────────────────────────────────────────────────────┘
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# ┌──────────────────────────────────────────────────────────────────┐
# │  Corners                                                         │
# └──────────────────────────────────────────────────────────────────┘
corner-radius = 0;

# ┌──────────────────────────────────────────────────────────────────┐
# │  Blur                                                            │
# └──────────────────────────────────────────────────────────────────┘
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;

# ┌──────────────────────────────────────────────────────────────────┐
# │  General Settings                                                │
# └──────────────────────────────────────────────────────────────────┘
backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

# ┌──────────────────────────────────────────────────────────────────┐
# │  Rules (Modern Syntax)                                           │
# └──────────────────────────────────────────────────────────────────┘
rules = (
  {
    match = "true"; # Default for all windows
    shadow = true;
    opacity = 1.0;
    dim = 0.0;
    blur-background = true;
  },
  {
    match = "!focused";
    opacity = 1.0;
  },
  {
    match = "class_g = 'Gnome-terminal'";
    opacity = 0.9;
  },
  {
    match = "class_g = 'Code'";
    opacity = 0.95;
  },
  {
    match = "class_g = 'Google-chrome' || class_g = 'firefox' || class_g = 'Chromium-browser'";
    opacity = 1.0;
    blur-background = false;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'normal' && (fullscreen || (_NET_WM_STATE@ *= '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@ *= '_NET_WM_STATE_MAXIMIZED_HORZ'))";
    corner-radius = 0;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  },
  {
    match = "window_type = 'tooltip'";
    fade = true;
    shadow = true;
    opacity = 0.75;
    full-shadow = false;
  },
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.9;
  }
);
