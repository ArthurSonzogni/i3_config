# ┌──────────────────────────────────────────────────────────────────┐
# │  Shadows                                                         │
# └──────────────────────────────────────────────────────────────────┘
shadow = false;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.75;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:s"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Fading                                                          │
# └──────────────────────────────────────────────────────────────────┘
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
fade-exclude = [ ];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Opacity & Dimming                                               │
# └──────────────────────────────────────────────────────────────────┘
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.15;

opacity-rule = [
    "90:class_g = 'Gnome-terminal'",
    "95:class_g = 'Code'",
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'firefox'"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Blur                                                            │
# └──────────────────────────────────────────────────────────────────┘
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:s"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  Corners                                                         │
# └──────────────────────────────────────────────────────────────────┘
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

# ┌──────────────────────────────────────────────────────────────────┐
# │  General Settings                                                │
# └──────────────────────────────────────────────────────────────────┘
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};
