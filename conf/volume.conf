# ┌──────────────────────────────────────────────────────────────────┐
# │  Media Control (Scripts)                                         │
# └──────────────────────────────────────────────────────────────────┘

set $volume_script ~/.config/i3/scripts/volume_control.sh
set $backlight_script ~/.config/i3/scripts/backlight_control.sh

# Volume Control
bindsym XF86AudioRaiseVolume exec --no-startup-id $volume_script up 5%
bindsym XF86AudioLowerVolume exec --no-startup-id $volume_script down 5%
bindsym XF86AudioMute        exec --no-startup-id $volume_script mute
bindsym XF86AudioMicMute     exec --no-startup-id $volume_script mic-mute

# Screen Brightness
bindsym XF86MonBrightnessUp   exec --no-startup-id $backlight_script up 5
bindsym XF86MonBrightnessDown exec --no-startup-id $backlight_script down 5

# Fine-grained Brightness (1% steps)
bindsym ctrl+XF86MonBrightnessUp   exec --no-startup-id $backlight_script up 1
bindsym ctrl+XF86MonBrightnessDown exec --no-startup-id $backlight_script down 1

# Media Player Controls
bindsym XF86AudioPlay  exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext  exec --no-startup-id playerctl next
bindsym XF86AudioPrev  exec --no-startup-id playerctl previous
bindsym XF86AudioStop  exec --no-startup-id playerctl stop
